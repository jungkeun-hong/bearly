# Bearly: sends the Meta glasses camera and microphone into one LiveKit room. Nothing else.
# Generate the Xcode project with:  DEVELOPMENT_TEAM=<your Apple team id> xcodegen generate
name: Bearly
options:
  bundleIdPrefix: com.bearly
  deploymentTarget:
    iOS: "17.2" # the Meta DAT 1.0.1 binaries need 17.2
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.12.1
targets:
  Bearly:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bearly.glasses
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bearly
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [bearly]
        LSApplicationQueriesSchemes: [fb-viewapp]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        UIBackgroundModes: [audio, bluetooth-central, bluetooth-peripheral, external-accessory]
        NSBluetoothAlwaysUsageDescription: Connects to your Meta glasses to stream their camera.
        NSCameraUsageDescription: Streams the glasses camera to the Bearly stage.
        NSMotionUsageDescription: Counts your steps and direction so the Bearly stage can show where you walk.
        NSMicrophoneUsageDescription: Sends your voice from the glasses microphone to the Bearly stage.
        NSLocalNetworkUsageDescription: Receives video from your Meta glasses and reaches the stage computer on this network.
        NSBonjourServices: [_mwdat._tcp, _companion-link._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # the stage Mac serves the room token over plain http on the local network
        # Meta DAT. An empty MetaAppID means glasses Developer Mode (Meta AI app > Settings > App Info > tap the version 5 times).
        MWDAT:
          AppLinkURLScheme: "bearly://"
          MetaAppID: ""
          TeamID: $(DEVELOPMENT_TEAM)
